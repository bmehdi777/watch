info:
  name: Create
  type: http
  seq: 5

http:
  method: POST
  url: "{{protocol}}://{{host}}:{{port}}/{{version}}/sources"
  body:
    type: json
    data: |-
      {
        "title": "Netflix Blog",
        "blog_url": "https://netflixtechblog.com/",
        "rss_url": "https://netflixtechblog.com/feed",
        "enabled": true
      }
  auth: inherit

runtime:
  variables:
    - name: sourceID
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
