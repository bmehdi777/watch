info:
  name: Generate TLDR
  type: http
  seq: 5

http:
  method: POST
  url: "{{protocol}}://{{host}}:{{port}}/api/{{version}}/articles/{{articleID}}/tldr"
  body:
    type: json
    data: |-
      {
        "force": true
      }
  auth: inherit

runtime:
  variables:
    - name: articleID
      value: 1e72e3e7-578c-4b26-bead-f015f95be2b0

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
